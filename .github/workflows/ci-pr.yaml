name: CI PR

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    needs:
      - typecheck
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pnpm setup
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma init
        run: pnpm prisma generate

      - name: Type check
        run: pnpm check

      - name: Run unit tests
        run: pnpm test -- --runInBand

      - name: Build project
        run: pnpm build
