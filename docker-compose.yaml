services:
  db:
    image: postgres:16-alpine
    container_name: logistic_mt_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    command: >
      postgres 
      -c shared_buffers=64MB 
      -c max_connections=20
      -c work_mem=4MB

volumes:
  postgres_data:
